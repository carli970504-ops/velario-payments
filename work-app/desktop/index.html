<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/Rn18uLLFwrheEYNU/OZseT6SZ836wZMFrZxtLWRn5A='; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Velario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app móvil de una columna, gráfica como protagonista, barra de pestañas inferior.
   Paleta: pizarra azulada + ámbar. Tipos: Bricolage Grotesque (títulos), IBM Plex Sans (texto), IBM Plex Mono (precios). */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#e5eaf3; --ink:#141c2b; --muted:#566379; --line:#d3dbe8;
  --accent:#f0a421; --accent-ink:#1c1204; --accent-fg:#9a5b00;
  --up:#0f8f68; --down:#d03b55; --badge:#16233a; --badge-ink:#f3f6fb; --chart:#f8fafd; --hl:rgba(240,164,33,.20); --lock:#aab4c6;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --surface:#151e2e; --surface2:#1d2840; --ink:#e9eef7; --muted:#93a1ba; --line:#26324b;
  --accent:#f6b63f; --accent-ink:#1c1204; --accent-fg:#f6b63f; --up:#3dd0a0; --down:#ff6f85; --badge:#26365a; --badge-ink:#f3f6fb; --chart:#101a2a; --hl:rgba(246,182,63,.18); --lock:#4a5876; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1420; --surface:#151e2e; --surface2:#1d2840; --ink:#e9eef7; --muted:#93a1ba; --line:#26324b;
  --accent:#f6b63f; --accent-ink:#1c1204; --accent-fg:#f6b63f; --up:#3dd0a0; --down:#ff6f85; --badge:#26365a; --badge-ink:#f3f6fb; --chart:#101a2a; --hl:rgba(246,182,63,.18); --lock:#4a5876; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);
  padding-block:16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.card.tap{width:100%;text-align:left;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 22px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.billing-message{min-height:1.5em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600}
.pill.up{color:var(--up)} .pill.dn{color:var(--down)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* cabecera */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.top .sub{margin-top:4px}
.stats-mini{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-weight:600;font-size:14px}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* gráfica */
.chart{width:100%;height:auto;display:block;background:var(--chart);border-radius:16px;border:1px solid var(--line)}
.chart .g{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .t{fill:var(--muted);font:400 10px var(--f-mono)}
.chart .hl{fill:var(--hl)}
.chart .ln{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:5 4}
.chart .lt{fill:var(--accent-fg);font:600 9.5px var(--f-body)}
.chart .up{stroke:var(--up);fill:var(--up)} .chart .dn{stroke:var(--down);fill:var(--down)}
.chart .nw{animation:rise .5s both}
@keyframes rise{from{opacity:0}to{opacity:1}}
.chartbox{position:relative}
.tag{position:absolute;left:10px;top:10px;font:500 11px var(--f-mono);background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.hero-chart .chart{border-radius:18px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .card{display:flex;flex-direction:column;gap:6px;text-align:left}
/* progreso */
.ring{display:flex;gap:18px;align-items:center}
.ring svg{width:112px;height:112px;flex:none}
.ring .num{font:800 26px var(--f-display);fill:var(--ink)}
.kv{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.kv b{font:700 24px var(--f-display)}
.kv small{color:var(--muted);font-size:14px}
/* ruta */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{display:flex;gap:6px}
.week i{flex:1;height:6px;border-radius:99px;background:var(--surface2)} .week i.on{background:var(--accent)}
.sec{margin-top:24px}
.secbar{display:flex;gap:4px;margin-top:10px;align-items:center}
.secbar i{flex:1;height:5px;border-radius:99px;background:var(--surface2)} .secbar i.on{background:var(--accent)}
.secbar span{font:500 13px var(--f-mono);color:var(--muted);margin-left:8px}
.path{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.node{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:14px 0;width:200px;position:relative;transform:translateX(var(--dx,0))}
.node:not(:last-child)::after{content:"";position:absolute;top:100%;left:50%;height:12px;border-left:2px dotted var(--line)}
.dot{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface2);color:var(--lock)}
.node.done .dot{background:var(--up);border-color:var(--up);color:var(--bg)}
.node.now .dot{background:var(--ink);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 30%,transparent);color:var(--bg)}
.node.lock{cursor:default}
.node .lbl{font:600 14px/1.25 var(--f-body);text-align:center;color:var(--ink)}
.node.lock .lbl{color:var(--muted)}
.here{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.dot svg.glyph{width:46px;height:46px}
.dot .ic{width:34px;height:34px}
/* biblioteca */
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:16px;padding:0 14px;color:var(--muted)}
.search input[type=search]{flex:1;min-width:0;border:0;border-radius:0;background:none;color:var(--ink);font:inherit;padding:13px 0;outline:none}
.search:focus-within{box-shadow:0 0 0 2px var(--accent)}
.prow{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.prow .gl{width:76px;height:64px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--surface2)}
.prow .gl.up{background:color-mix(in srgb,var(--up) 12%,var(--surface))}
.prow .gl.down{background:color-mix(in srgb,var(--down) 12%,var(--surface))}
.pm{flex:1;min-width:0}
.pm .eb{font:600 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.eb.up{color:var(--up)} .eb.down{color:var(--down)} .eb.neutral{color:var(--muted)}
.pm h3{margin:3px 0 2px}
.pm p{color:var(--muted);font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm .dots{margin-top:7px}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface2)} .dots i.on{background:var(--accent)}
/* perfil */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.badge svg{width:72px;height:72px}
.bshape{fill:var(--badge);stroke:var(--accent);stroke-width:3} .bshape.lk{fill:var(--surface2);stroke:var(--lock)}
.binner{fill:none;stroke:var(--accent);stroke-opacity:.35;stroke-width:1}
.bic{color:var(--accent)} .bic.lk{color:var(--lock)}
.bnum{font:800 21px var(--f-display);fill:var(--badge-ink)} .bnum.lk{fill:var(--lock)}
.bsub{font:600 4.8px var(--f-body);letter-spacing:.06em;fill:var(--accent)} .bsub.lk{fill:var(--lock)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px 16px}
.bgrid .badge{gap:8px} .bgrid .badge svg{width:96px;height:96px}
.bgrid .bn{font:700 17px var(--f-display);color:var(--ink)}
.bgrid .how{font-size:12px;line-height:1.35;color:var(--muted)}
.badge b{color:var(--ink);font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat b{font:800 26px var(--f-display)}
.map{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.map i{aspect-ratio:1;border-radius:7px;background:var(--surface2)}
.map i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--surface2))}
.map i.l2{background:color-mix(in srgb,var(--accent) 70%,var(--surface2))}
.map i.l3{background:var(--accent)}
input[type=text],input[type=search]{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit}
/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.tabs nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.tabs button{border:0;background:none;border-radius:999px;padding:12px 18px;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
/* overlay */
#overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ovtop{display:flex;align-items:center;gap:12px}
.x{border:0;background:var(--surface2);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.prog{display:flex;gap:5px;flex:1}
.prog i{flex:1;height:6px;border-radius:99px;background:var(--surface2)} .prog i.on{background:var(--accent)} .prog i.bad{background:var(--down)}
.q{font:800 24px/1.15 var(--f-display)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;font-weight:600}
.opt:disabled{cursor:default}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font:600 13px var(--f-mono);flex:none}
.opt.right{border-color:var(--up);background:color-mix(in srgb,var(--up) 14%,var(--surface))}
.opt.wrong{border-color:var(--down);background:color-mix(in srgb,var(--down) 14%,var(--surface))}
.res{font:800 26px/1.1 var(--f-display)}
.res.ok{color:var(--up)} .res.no{color:var(--down)}
.key{background:var(--surface2);border-radius:16px;padding:14px}
.key b{display:block;color:var(--accent-fg);font-size:13px;margin-bottom:4px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{font-weight:600;cursor:pointer}
ul.look{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.big{font:800 54px/1 var(--f-display)}
.note{font-size:12.5px;color:var(--muted)}
.warn{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-radius:16px;padding:14px}
.warn b{display:flex;gap:8px;align-items:center;color:var(--accent-fg);font-size:14px;margin-bottom:4px}
.rel{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.relc{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface2);border:0;border-radius:18px;padding:10px 14px;font-weight:600;text-align:left}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exgrid .tag{left:6px;top:6px;font-size:10px}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dirb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 10px;border-radius:20px;border:0;font-weight:700;font-size:17px}
.dirb .ic{width:30px;height:30px}
.dirb.u{background:color-mix(in srgb,var(--up) 15%,var(--surface));color:var(--up)}
.dirb.d{background:color-mix(in srgb,var(--down) 15%,var(--surface));color:var(--down)}
.dirb.right{box-shadow:0 0 0 2.5px var(--up)} .dirb.wrong{box-shadow:0 0 0 2.5px var(--down)}
.dirb:disabled:not(.right):not(.wrong){opacity:.45}
.link{border:0;background:none;color:var(--muted);padding:10px;font-weight:500;align-self:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.chart .nw{animation:none}}


/* --- presupuesto: canon, billetes y ladron --- */
.cash-pill{color:var(--up);border-color:var(--line)}
.cash-mini{color:var(--up);font-weight:600}
.fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.cannon{position:absolute;left:16px;bottom:84px;width:62px;height:46px}
.cannon .barrel{position:absolute;left:2px;bottom:14px;width:48px;height:16px;border-radius:9px;background:linear-gradient(180deg,#4a5568,#141c2b);transform:rotate(-26deg)}
.cannon .wheel{position:absolute;left:8px;bottom:0;width:20px;height:20px;border-radius:50%;background:#141c2b;border:3px solid var(--accent)}
.cannon .boom{position:absolute;left:48px;top:-6px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#ffe08a 0%,rgba(255,224,138,0) 70%);animation:boom .4s ease-out forwards}
.bill{position:absolute;font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));animation:fly 1.15s cubic-bezier(.2,.6,.4,1) forwards}
.billup{position:absolute;transform:translate(-50%,-50%);font-weight:800;color:var(--up);font-size:22px;animation:billup 1.2s ease-out forwards}
.thief{position:absolute;right:-90px;bottom:82px;font-size:44px;animation:steal 1.7s ease-in forwards}
.loss{position:absolute;right:26px;bottom:134px;font-weight:800;color:var(--down);font-size:20px;animation:billup2 1.5s ease-out forwards}
.cartel{position:absolute;left:50%;top:15%;transform:translate(-50%,-160%);background:linear-gradient(180deg,#ff6b6b,#d03b55);color:#fff;padding:14px 18px;border-radius:14px;font-weight:800;font-size:14px;line-height:1.25;letter-spacing:.6px;text-align:center;max-width:86vw;box-shadow:0 14px 34px rgba(0,0,0,.35);animation:cartel 2.8s ease forwards}
@keyframes boom{from{transform:scale(.3);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
@keyframes billup{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-140%)}}
@keyframes billup2{0%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}
@keyframes steal{0%{right:-90px;opacity:0}18%{right:22px;opacity:1}72%{right:22px;opacity:1}100%{right:-100px;opacity:0}}
@keyframes cartel{0%{transform:translate(-50%,-160%)}12%{transform:translate(-50%,0) rotate(-2deg)}20%{transform:translate(-50%,0) rotate(2deg)}26%{transform:translate(-50%,0)}80%{transform:translate(-50%,0)}100%{transform:translate(-50%,-170%)}}
.fx.quiet *{animation:none!important}
.fx.quiet .cartel{transform:translate(-50%,0)}
.fx.quiet .thief{right:22px;opacity:1}
/* ===== Mesa ===== */
.seg.desk4{grid-template-columns:repeat(4,1fr)}
.tabs button{padding:11px 15px}
.desk-list{display:flex;flex-direction:column;gap:0;padding:6px 8px}
.desk-row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:11px 8px;border-radius:12px;text-align:left;color:inherit}
.desk-row+.desk-row{box-shadow:inset 0 1px 0 var(--line)}
.desk-row[aria-pressed="true"]{background:var(--surface2)}
.desk-row .ds{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.desk-row .ds b{font-size:15px;letter-spacing:.01em}
.desk-row .ds small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desk-row .dp{font:600 14px var(--f-mono)}
.pct{font:600 12px var(--f-mono);padding:3px 8px;border-radius:999px;background:var(--surface2);min-width:68px;text-align:right}
.pct.up{color:var(--up)}
.pct.dn{color:var(--down)}
.tfbar{display:flex;gap:6px;flex-wrap:wrap}
.tfbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:600 12px var(--f-body);color:var(--muted)}
.tfbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.desk-chart{background:var(--chart);border:1px solid var(--line);border-radius:16px;padding:6px}
.desk-chart svg{display:block;width:100%;height:auto}
.desk-empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:13px}
.ticket{display:flex;align-items:center;gap:10px}
.ticket input{width:82px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 8px;font:600 15px var(--f-mono);color:var(--ink);text-align:center}
.chain{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 8px;align-items:center}
.chain .h{font:600 10px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:center}
.chain button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 6px;font:600 13px var(--f-mono);color:var(--ink)}
.chain button:active{background:var(--surface2)}
.chain .k{text-align:center;font:600 13px var(--f-mono);color:var(--muted)}
.pos{display:flex;align-items:center;gap:10px;padding:10px 0}
.pos+.pos{border-top:1px solid var(--line)}
.pos .pn{flex:1;min-width:0}
.pos .pn b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  if (DESK.vol[sym]) return DESK.vol[sym];

  const rets = [];

  const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
  const variance = rets.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, rets.length - 1);

}

  const out = [];
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 7);
  while (d.getDay() !== 5) d.setDate(d.getDate() + 1);
  for (let i = 0; i < (n || 3); i++) { out.push(new Date(d)); d.setDate(d.getDate() + 7); }
  return out;
}
function deskOptPrice(p) {
  const spot = DESK.q[p.sym]?.price ?? p.avg;
  const days = Math.max(0, (new Date(p.exp + 'T20:00:00Z').getTime() - Date.now()) / 864e5);
  return deskBS(p.type, spot, p.strike, days / 365, DESK.vol[p.sym] || 0.35);
}
async function deskChain() {
  if (!deskBridge() || DESK.opt.busy) return;
  DESK.opt.busy = true;
  try {
    const under = DESK.opt.under;
    await deskQuotes([under]);
    const q = DESK.q[under];
    if (!q) { DESK.opt.chain = null; return; }
    const vol = await deskVol(under);
    const exps = deskExpiries(3);
    const exp = DESK.opt.exp && exps.some(d => deskIso(d) === DESK.opt.exp) ? DESK.opt.exp : deskIso(exps[0]);
    DESK.opt.exp = exp;
    const days = Math.max(1, Math.round((new Date(exp + 'T20:00:00Z').getTime() - Date.now()) / 864e5));
    const T = days / 365;
    const step = q.price < 25 ? 1 : q.price < 100 ? 2.5 : q.price < 500 ? 5 : 10;
    const strikes = [...new Set([-0.1, -0.05, 0, 0.05, 0.1].map(k => Math.round(q.price * (1 + k) / step) * step))].sort((a, b) => a - b);
    const rows = strikes.map(K => ({ K, call: deskBS('call', q.price, K, T, vol), put: deskBS('put', q.price, K, T, vol) }));
    DESK.opt.chain = { under, exp, days, T, vol, spot: q.price, rows };
  } catch (e) {
    DESK.opt.chain = null;
    DESK.err = 'No se pudo calcular la cadena de opciones.';
  } finally {
    DESK.opt.busy = false;
    if (tab === 'mesa') render();
  }
}

/* ---------- cartera ---------- */
function deskPriceOf(sym) { return DESK.q[sym]?.price ?? null; }
function deskValue(p) {
  if (p.kind === 'opt') return p.qty * 100 * deskOptPrice(p);
  return p.qty * (deskPriceOf(p.sym) ?? p.avg);
}
function deskCostOf(p) { return p.kind === 'opt' ? p.qty * 100 * p.avg : p.qty * p.avg; }
function deskEquity() { return Object.values(DT.pos).reduce((s, p) => s + deskValue(p), 0) + DT.cash; }

function deskTradeSpot(side) {
  const q = DESK.q[DESK.sym];
  if (!q || !q.price) return deskSay('down', 'Todavía no hay precio para ese símbolo.');
  const n = Math.max(0.0001, Number(DESK.qty) || 1);
  const held = DT.pos[q.symbol];
  if (side === 'buy') {
    const cost = n * q.price;
    if (cost > DT.cash + 1e-9) return deskSay('down', `Te faltan ${deskUsd(cost - DT.cash)} para esa compra.`);
    deskCash(-cost);
    if (held) { held.avg = (held.avg * held.qty + cost) / (held.qty + n); held.qty += n; }
    else DT.pos[q.symbol] = { id: q.symbol, sym: q.symbol, name: `${q.symbol} · ${q.name || ''}`.trim(), kind: 'spot', qty: n, avg: q.price };
    DT.trades++; deskPersist();
    deskSay('up', `Compraste ${deskNum(n)} ${q.symbol} a ${deskUsd(q.price)}.`);
  } else {
    if (!held) return deskSay('down', `No tienes ${q.symbol} en cartera.`);
    const m = Math.min(held.qty, n);
    const ingreso = m * q.price;
    DT.realized += (q.price - held.avg) * m;
    deskCash(ingreso);
    held.qty -= m;
    if (held.qty <= 1e-9) delete DT.pos[held.sym];
    DT.trades++; deskPersist();
    deskSay('up', `Vendiste ${deskNum(m)} ${q.symbol} a ${deskUsd(q.price)}.`);
  }
}
function deskBuyOption(type, strike) {
  const chain = DESK.opt.chain;
  if (!chain) return deskSay('down', 'La cadena de opciones aún no está lista.');
  const row = chain.rows.find(r => Math.abs(r.K - strike) < 1e-9);
  if (!row) return deskSay('down', 'Ese contrato ya no está disponible.');
  const n = Math.max(1, Math.floor(Number(DESK.qty) || 1));
  const premium = row[type];
  const cost = n * 100 * premium;
  if (cost > DT.cash + 1e-9) return deskSay('down', `Esa orden cuesta ${deskUsd(cost)} y no te alcanza.`);
  const id = `${chain.under}|${chain.exp}|${type}|${strike}`;
  deskCash(-cost);
  const held = DT.pos[id];
  if (held) { held.avg = (held.avg * held.qty + premium * n) / (held.qty + n); held.qty += n; }
  else DT.pos[id] = { id, sym: chain.under, name: `${chain.under} ${type === 'call' ? 'Call' : 'Put'} ${strike}`, kind: 'opt', qty: n, avg: premium, type, strike, exp: chain.exp };
  DT.trades++; deskPersist();
  deskSay('up', `Compraste ${n} contrato${n > 1 ? 's' : ''} ${type.toUpperCase()} ${strike} de ${chain.under} por ${deskUsd(cost)}.`);
}
function deskClose(id) {
  const p = DT.pos[id];
  if (!p) return;
  const value = deskValue(p);
  DT.realized += value - deskCostOf(p);
  deskCash(value);
  delete DT.pos[id];
  DT.trades++; deskPersist();
  deskSay('up', `Cerraste ${p.name} por ${deskUsd(value)}.`);
}

/* ---------- acciones de interfaz ---------- */
function deskSeg(seg) {
  if (!DESK_SEGS[seg]) return;
  DESK.seg = seg;
  DESK.sym = DESK_SEGS[seg].items[0][0];
  DESK.tf = '1D';
  DESK.chart = null; DESK.chartErr = null; DESK.msg = null;
  if (seg === 'opciones') { DESK.opt.under = DESK.sym; DESK.opt.exp = null; DESK.opt.chain = null; }
  render();
  deskEnsure(true);
}
function deskPick(sym) {
  DESK.msg = null;
  if (DESK.seg === 'opciones') {
    DESK.opt.under = sym; DESK.sym = sym; DESK.opt.exp = null; DESK.opt.chain = null;
    render(); deskEnsure(true); return;
  }
  DESK.sym = sym; DESK.chart = null; DESK.chartErr = null;
  render(); deskChart();
}

/* ---------- vistas ---------- */
function deskRow(sym, label, selected) {
  const q = DESK.q[sym];
  const cls = !q ? '' : q.changePct > 0 ? 'up' : q.changePct < 0 ? 'dn' : '';
  return `<button class="desk-row" data-act="desksym" data-id="${sym}" aria-pressed="${selected ? 'true' : 'false'}">
    <span class="ds"><b>${sym}</b><small>${esc(label)}</small></span>
    <span class="dp">${q ? deskUsd(q.price) : '—'}</span>
    <span class="pct ${cls}">${q ? deskPctTxt(q.changePct) : '—'}</span></button>`;
}
function deskChartBox() {
  if (DESK.chartErr) return `<div class="desk-empty">${esc(DESK.chartErr)}</div>`;
  if (!DESK.chart || DESK.chartSym !== DESK.sym || DESK.chartTf !== DESK.tf) return '<div class="desk-empty">Cargando gráfica…</div>';
  const cs = DESK.chart.candles.map(c => ({ o: c.o, c: c.c, h: c.h, l: c.l }));
  const dec = DESK.chart.price >= 1000 ? 2 : 2;
  return chart({ c: cs, after: [], dec, lines: [], showHl: false }, false, 236);
}
function deskDetail() {
  const q = DESK.q[DESK.sym];
  const cls = !q ? '' : q.changePct > 0 ? 'up' : q.changePct < 0 ? 'dn' : '';
  const total = DESK.qty * (q?.price || 0);
  return `<div class="card stack" style="gap:12px">
    <div class="row between" style="align-items:flex-start">
      <div style="min-width:0"><div class="eyebrow">${DESK_SEGS[DESK.seg].label}</div><h2 style="margin-top:4px">${DESK.sym}</h2><p class="muted" style="font-size:13px;margin-top:2px">${esc(q?.name || '')}</p></div>
      <div style="text-align:right;flex:none"><div class="mono" style="font-size:22px;font-weight:600">${q ? deskUsd(q.price) : '—'}</div><span class="pct ${cls}" style="display:inline-block;margin-top:4px">${q ? deskPctTxt(q.changePct) : '—'}</span></div>
    </div>
    <div class="tfbar">${Object.keys(DESK_TF).map(t => `<button data-act="desktf" data-v="${t}" aria-pressed="${DESK.tf === t}">${t}</button>`).join('')}</div>
    <div class="desk-chart">${deskChartBox()}</div>
    <div class="ticket"><label class="eyebrow" for="dq">Cantidad</label><input id="dq" type="number" min="0.0001" step="any" inputmode="decimal" value="${DESK.qty}"><span class="mono muted" style="margin-left:auto" id="dTotal">${deskUsd(total)}</span></div>
    <div class="row" style="gap:10px"><button class="btn" data-act="deskbuy" style="flex:1">Comprar</button><button class="btn ghost" data-act="desksell" style="flex:1">Vender</button></div>
    <p class="note" style="margin:0">Precio real de Yahoo Finance (puede ir con retraso). La orden es simulada y se paga con tu saldo.</p></div>`;
}
function deskOptions() {
  const chain = DESK.opt.chain;
  const exps = deskExpiries(3);
  const head = `<div class="card stack" style="gap:12px">
    <div class="row between"><div><div class="eyebrow">Opciones simuladas</div><h2 style="margin-top:4px">${DESK.opt.under}</h2><p class="muted" style="font-size:13px;margin-top:2px">${chain ? `${deskUsd(chain.spot)} · volatilidad ${(chain.vol * 100).toFixed(0)}% · ${chain.days} días` : 'Calculando cadena…'}</p></div>
    <span class="pill mono">1 contrato = 100</span></div>
    <div class="chips">${exps.map(d => `<button data-act="deskoptexp" data-v="${deskIso(d)}" aria-pressed="${DESK.opt.exp === deskIso(d)}">${deskIso(d).slice(5)}</button>`).join('')}</div>
    ${chain ? `<div class="chain"><span class="h">Call</span><span class="h">Strike</span><span class="h">Put</span>
      ${chain.rows.map(r => `<button data-act="deskopt" data-k="call:${r.K}">${deskUsd(r.call)}</button><span class="k">${r.K % 1 ? r.K.toFixed(2) : r.K}</span><button data-act="deskopt" data-k="put:${r.K}">${deskUsd(r.put)}</button>`).join('')}</div>
      <div class="ticket"><label class="eyebrow" for="dq">Contratos</label><input id="dq" type="number" min="1" step="1" inputmode="numeric" value="${DESK.qty}"><span class="muted" style="margin-left:auto;font-size:12px">Toca un precio para comprar</span></div>` : '<div class="desk-empty">Cargando cadena de opciones…</div>'}
    <p class="note" style="margin:0">Contratos simulados: el precio sale de Black-Scholes con el precio real del subyacente y su volatilidad reciente. No son opciones reales de mercado.</p></div>`;
  return head;
}
function deskPositions() {
  const list = Object.values(DT.pos);
  if (!list.length) return `<div class="card"><div class="row between"><span class="eyebrow">Tu cartera</span><b class="mono">${deskUsd(deskEquity())}</b></div><p class="muted" style="margin-top:8px">Sin posiciones todavía.</p></div>`;
  return `<div class="card">
    <div class="row between" style="margin-bottom:6px"><span class="eyebrow">Tu cartera · ${list.length}</span><b class="mono">${deskUsd(deskEquity())}</b></div>
    ${list.map(p => {
      const value = deskValue(p), cost = deskCostOf(p), diff = value - cost;
      return `      <div class="pos"><div class="pn"><b>${esc(p.name)}</b><small>${deskNum(p.qty)} ${p.kind === 'opt' ? 'contrato' + (p.qty > 1 ? 's' : '') : 'unidad' + (p.qty > 1 ? 'es' : '')} · ${p.kind === 'opt' ? 'vence ' + p.exp : 'media ' + deskUsd(p.avg)}</small></div>
        <div class="pv"><b>${deskUsd(value)}</b><small style="color:var(--${diff >= 0 ? 'up' : 'down'})">${diff >= 0 ? '+' : ''}${deskUsd(diff)}</small></div>
        <button class="link" data-act="deskclose" data-id="${esc(p.id)}" style="padding:6px 0 6px 8px">Cerrar</button></div>`;
    }).join('')}</div>`;
}
function viewMesa() {
  if (!deskBridge()) {
    return `<div class="stack"><h1>Astra Desk</h1><div class="card"><h3>Disponible en la app de escritorio</h3><p class="muted">La Mesa pide los precios a Yahoo Finance desde la app instalada. Abre Velario Pro para operar.</p></div></div>`;
  }
  const seg = `<div class="seg desk4">${Object.entries(DESK_SEGS).map(([k, v]) => `<button data-act="deskseg" data-v="${k}" aria-pressed="${DESK.seg === k}">${v.label}</button>`).join('')}</div>`;
  const msg = DESK.msg ? `<div class="card msg"><p style="margin:0;font-size:14px;color:var(--${DESK.msg.kind === 'up' ? 'up' : 'down'})">${esc(DESK.msg.text)}</p></div>` : '';
  const err = DESK.err ? `<div class="card"><p class="muted" style="margin:0 0 10px">${esc(DESK.err)}</p><button class="btn ghost" data-act="deskrefresh">Reintentar</button></div>` : '';
  const list = `<div class="card desk-list">${DESK_SEGS[DESK.seg].items.map(([s, l]) => deskRow(s, l, s === DESK.sym)).join('')}</div>`;
  return `<div class="stack">
    <div class="top" style="margin-bottom:0"><div><h1>Astra Desk</h1><p class="muted sub">Precios reales · operaciones simuladas</p></div>
      <div class="stats-mini"><span class="row" style="gap:6px"><span class="mono cash-mini">${deskUsd(DT.cash)}</span></span><span class="pill mono">${deskUsd(deskEquity())}</span></div></div>
    ${seg}${msg}${err}${list}${DESK.seg === 'opciones' ? deskOptions() : deskDetail()}${deskPositions()}
    <p class="note">Datos de Yahoo Finance. Todo se ejecuta en simulado: nada de esto es dinero real ni asesoría financiera.</p></div>`;
}

/* Refresco automático mientras la mesa está abierta */
setInterval(() => {
  if (tab !== 'mesa' || document.hidden || !deskBridge()) return;
  const items = DESK_SEGS[DESK.seg].items.map(x => x[0]);
  deskQuotes(items).then(ok => { if (ok && tab === 'mesa') render(); });
}, 30000);

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'sub') { sub = el.dataset.v; render(); }
  else if (a === 'filt') { filt = el.dataset.v; render(); }
  else if (a === 'goLib') { sub = 'lib'; go('aprende'); }
  else if (a === 'goPerfil') go('perfil');
  else if (a === 'badges') showBadges(false);
  else if (a === 'help') showBadges(true);
  else if (a === 'detail') showDetail(id, false);
  else if (a === 'lesson') showDetail(id, true);
  else if (a === 'another') showDetail(id, OV && OV.lesson);
  else if (a === 'startLesson') startLesson(id);
  else if (a === 'startPat') startPatternPractice(id);
  else if (a === 'purchase') requestPurchase(el.dataset.method || 'play');
  else if (a === 'pro') showPaywall();
  else if (a === 'restore') refreshBilling(true);
  else if (a === 'manage') { const bridge = billingBridge(); if (bridge?.manage) Promise.resolve(bridge.manage()).catch(() => { billing.message = 'No se pudo abrir la gestión de suscripción.'; showPaywall(); }); }
  else if (a === 'moreEx') moreEx(id);
  else if (a === 'practice') startPractice();
  else if (a === 'pick') pick(id);
  else if (a === 'next' && SS && SS.qs[SS.i]?.pick !== null) { SS.i++; if (SS.i >= SS.qs.length) finish(); else showQ(); }
  else if (a === 'deskseg') deskSeg(el.dataset.v);
  else if (a === 'desksym') deskPick(el.dataset.id);
  else if (a === 'desktf') { DESK.tf = el.dataset.v; DESK.chart = null; render(); deskChart(); }
  else if (a === 'deskbuy') deskTradeSpot('buy');
  else if (a === 'desksell') deskTradeSpot('sell');
  else if (a === 'deskclose') deskClose(el.dataset.id);
  else if (a === 'deskopt') { const par = (el.dataset.k || '').split(':'); if (par.length === 2) deskBuyOption(par[0], Number(par[1])); }
  else if (a === 'deskoptexp') { DESK.opt.exp = el.dataset.v; render(); deskChain(); }
  else if (a === 'deskrefresh') { DESK.msg = null; DESK.err = null; deskEnsure(true); }
  else if (a === 'close') closeOv();
  else if (a === 'reset') { document.getElementById('rstBox').innerHTML = `<p style="margin-bottom:10px">Se borran tus lecciones, XP e insignias de este navegador.</p><div class="row" style="gap:10px"><button class="btn ghost" data-act="rstNo" style="flex:1">Cancelar</button><button class="btn" data-act="rstYes" style="flex:1">Borrar</button></div>`; }
  else if (a === 'rstNo') render();
  else if (a === 'rstYes') { S = fresh(); save(); heroSm = null; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'dq') { DESK.qty = Math.max(0.0001, Number(e.target.value) || 0); const q = DESK.q[DESK.sym]; const t = document.getElementById('dTotal'); if (t) t.textContent = deskUsd(DESK.qty * (q?.price || 0)); }
  if (e.target.id === 'nm') { S.name = e.target.value.trim(); save(); }
  if (e.target.id === 'libq') { libQ = e.target.value; const l = document.getElementById('libList'); if (l) l.innerHTML = libListHTML(); }
});
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (['inicio', 'aprende', 'mesa', 'perfil'].includes(t) && t !== tab) { tab = t; render(); } });
{ const t = location.hash.slice(1); if (['inicio', 'aprende', 'mesa', 'perfil'].includes(t)) tab = t; }
render();
window.addEventListener('velario:billing', event => applyBilling(event.detail));
window.velarioBack = () => {
  if (!ov().hidden) { closeOv(); return true; }
  if (tab !== 'inicio') { go('inicio'); return true; }
  return false;
};
window.addEventListener('focus', () => refreshBilling());
document.addEventListener('keydown', event => {
  if (ov().hidden) return;
  if (event.key === 'Escape') { event.preventDefault(); closeOv(); return; }
  if (event.key !== 'Tab') return;
  const focusable = Array.from(ov().querySelectorAll('button:not(:disabled),a[href],input,summary')).filter(node => node.getClientRects().length);
  if (!focusable.length) return;
  if (event.shiftKey && document.activeElement === focusable[0]) { event.preventDefault(); focusable.at(-1).focus(); }
  else if (!event.shiftKey && document.activeElement === focusable.at(-1)) { event.preventDefault(); focusable[0].focus(); }
});
refreshBilling();

</script>
